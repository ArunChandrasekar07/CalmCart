name: Build Android APK

# Builds a real, installable .apk on GitHub's own cloud runners — no Expo
# account, no EAS login, nothing to install locally. Download the result
# from the finished run's "Artifacts" section at the bottom of the page.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this, a hung build (e.g. a slow/stalled Gradle dependency
    # fetch with no caching) just sits "in progress" for hours instead of
    # failing fast with a useful log.
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (Continuous Native Generation)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Keyed on the generated android/ project (CNG output), which
          # only exists after prebuild above runs — without that, the
          # cache key can't be computed and the step just errors out.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          # Give the single (--no-daemon) Gradle JVM more heap so a larger
          # dependency graph (new native modules, new architecture codegen)
          # doesn't thrash/stall instead of just finishing.
          GRADLE_OPTS: -Xmx4096m -Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalmCart-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
